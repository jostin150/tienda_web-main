{% extends "base.html" %}

{% block titulo %}Mis datos{% endblock %}

{% block contenido %}
<main class="pagina">
  <div class="encabezado-pagina">
    <div>
      <p class="antetitulo">DEJA VACÍO LO QUE NO QUIERAS CAMBIAR</p>
      <h1 class="titulo-pagina">Mis datos</h1>
    </div>
  </div>

  <section class="caja caja-form" aria-label="Actualizar datos">
    <form method="post">
      <div class="campo">
        <label for="name">Nombre</label>
        <input id="name" name="name" placeholder="{{ usuario.name }}" autocomplete="name">
      </div>

      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" name="email" placeholder="{{ usuario.email }}" autocomplete="email">
      </div>

      <div class="campo">
        <label for="phone">Teléfono</label>
        <input id="phone" name="phone" placeholder="{{ usuario.phone }}" autocomplete="tel">
      </div>

      <div class="campo campo-clave">
        <label for="password">Nueva contraseña</label>
        <input id="password" type="password" name="password" autocomplete="new-password">
        <button type="button" class="ver-clave" aria-label="Mostrar contraseña">VER</button>
      </div>

      <button type="submit" class="boton-negro">Guardar</button>
    </form>
  </section>
</main>
{% endblock %}
