{% extends "base.html" %}
 
{% block titulo %}Inicia sesión · Tienda Interactiva{% endblock %}
 
{% block contenido %}
<main class="login">
  <section>
    <p class="antetitulo">THE WORLD IS YOURS</p>
    <h1 class="gigante">THINK IT<br>MAKE IT.</h1>
  </section>
 
  <section class="caja" aria-labelledby="titulo-login">
    <span class="etiqueta-roja" aria-hidden="true">DO IT</span>
    <h1 id="titulo-login">Inicia sesión</h1>
 
    <form method="post" action="{{ url_for('login') }}">
      <div class="campo">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
      </div>
 
      <div class="campo campo-clave">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password">
        <button type="button" class="ver-clave" aria-label="Mostrar contraseña">VER</button>
      </div>
 
      <button type="submit" class="boton-negro">Entrar</button>
    </form>
    <p class="pie-caja"> <a href="{{ url_for('registro') }}">Regístrate</a></p>
  </section>
</main>
{% endblock %}
