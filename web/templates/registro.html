{% extends "base.html" %}

{% block titulo %}Crea tu cuenta{% endblock %}
{% block clase_pagina %}pagina-auth{% endblock %}

{% block contenido %}
<main class="login">
  <section>
    <p class="antetitulo">ROPA Y RELOJES / SIN PERMISO</p>
    <h1 class="gigante">Súmate<br>a la calle.</h1>
  </section>

  <section class="caja" aria-labelledby="titulo-registro">
    <span class="etiqueta-roja" aria-hidden="true">NUEVO</span>
    <h1 id="titulo-registro">Crea tu cuenta</h1>

    <form method="post">
      <div class="campo">
        <label for="name">Nombre</label>
        <input id="name" name="name" placeholder="Tu nombre" required autofocus autocomplete="name" value="{{ request.form.name }}">
      </div>

      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" name="email" placeholder="tucorreo@ejemplo.com" required autocomplete="email" value="{{ request.form.email }}">
      </div>

      <div class="campo campo-clave">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" placeholder="Crea una contraseña" required autocomplete="new-password">
        <button type="button" class="ver-clave" aria-label="Mostrar contraseña">VER</button>
      </div>

      <div class="campo">
        <label for="phone">Teléfono</label>
        <input id="phone" name="phone" placeholder="Tu número de teléfono" required autocomplete="tel" value="{{ request.form.phone }}">
      </div>

      <button type="submit" class="boton-negro">Registrarme</button>
    </form>

    <p class="pie-caja">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
  </section>
</main>
{% endblock %}
